<!doctype html>
<html lang="ar" dir="rtl">
  <body style="margin:0;background:#0b0f14;font-family:Tahoma,Arial,sans-serif;color:#e8edf3">
    <div style="max-width:480px;margin:0 auto;padding:32px 24px;text-align:center">
      <h1 style="font-size:22px;margin:0 0 8px">GoalMood <span style="color:#22c55e">plus</span></h1>
      <p style="color:#8b98a9;margin:0 0 24px">رمز الدخول إلى حسابك</p>
      <div style="font-size:34px;font-weight:bold;letter-spacing:8px;background:#131a22;border-radius:12px;padding:16px;margin-bottom:24px" dir="ltr">{{ .Token }}</div>
      <p style="margin:0 0 16px">أو اضغط على الزر لتسجيل الدخول مباشرة:</p>
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#22c55e;color:#052e14;font-weight:bold;text-decoration:none;padding:12px 28px;border-radius:10px">تسجيل الدخول</a>
      <p style="color:#8b98a9;font-size:12px;margin-top:28px">الرمز صالح لمدة ساعة. إذا لم تطلب الدخول تجاهل هذه الرسالة.</p>
    </div>
  </body>
</html>
